<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคัดกรองยาเสพติดนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        .zoom-in { animation: zoomIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @media print {
            body { background: white !important; }
            nav, .print-hidden { display: none !important; }
            main { padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; }
            .border-slate-200 { border-color: #ddd !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd; padding: 8px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="app"></div>

    <script>
        // URL Google Apps Script ของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsg4ECoLhRVfgapZULY0nf4knpj5T0V7eEKexG1AKKlNReJ8pveNoIb7k9EjCleNPyXg/exec';

        // --- ข้อมูลพื้นฐาน ---
        const generateClasses = () => {
            const classes = [];
            for (let i = 1; i <= 3; i++) for (let j = 1; j <= 9; j++) classes.push(`ม.${i}/${j}`);
            for (let i = 4; i <= 6; i++) for (let j = 1; j <= 10; j++) classes.push(`ม.${i}/${j}`);
            return classes;
        };

        const allClasses = generateClasses();
        const substanceTypes = ['กัญชา', 'กระท่อม', 'ใช้ยาเสพติด', 'บุหรี่', 'บุหรี่ไฟฟ้า', 'เครื่องดื่มแอลกอฮอล์'];

        // --- State Management ---
        const state = {
            currentView: 'home',
            isLoading: true, // เริ่มต้นด้วยสถานะกำลังโหลด
            submissions: [],
            isAdminLoggedIn: false,
            editingData: null,
            form: { className: '', riskCount: '', leaderName: '', students: [] },
            reportFilters: { grade: 'all', class: 'all', type: 'all', substance: 'all' },
            confirmModal: { isOpen: false, classToEdit: '' }
        };

        // --- Core Functions ---
        
        // ดึงข้อมูลจาก Google Sheets ตอนเปิดเว็บ
        async function loadDataFromSheet() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                // จัดกลุ่มข้อมูลตามห้องเรียน
                const groupedData = {};
                data.forEach(row => {
                    if (!groupedData[row.className]) {
                        groupedData[row.className] = {
                            id: row.timestamp,
                            className: row.className,
                            leaderName: row.leaderName,
                            riskCount: row.riskCount || 0,
                            timestamp: row.timestamp,
                            students: []
                        };
                    }
                    if (row.studentName && row.studentName !== "ไม่มีนักเรียนกลุ่มเสี่ยง/เสพ" && row.studentName !== "ไม่มี") {
                        groupedData[row.className].students.push({
                            name: row.studentName,
                            type: row.type,
                            substances: row.substances ? row.substances.split(',').map(s => s.trim()) : []
                        });
                    }
                });
                
                state.submissions = Object.values(groupedData);
            } catch (error) {
                console.error("โหลดข้อมูลล้มเหลว:", error);
            } finally {
                state.isLoading = false;
                renderApp();
            }
        }

        // ฟังก์ชันเล่นเสียง
        function playThankYouSound() {
            if ('speechSynthesis' in window) {
                const msg = new SpeechSynthesisUtterance();
                msg.text = "ขอบคุณที่ให้ความร่วมมือ แล้วมาสร้างโรงเรียนปลอดยาเสพติดด้วยกัน ขอบคุณครับ";
                msg.lang = 'th-TH'; // ภาษาไทย
                window.speechSynthesis.speak(msg);
            }
        }

        function navigateTo(view) {
            state.currentView = view;
            renderApp();
        }

        function handleClassClick(cls) {
            const existingSubmission = state.submissions.find(s => s.className === cls);
            if (existingSubmission) {
                state.confirmModal = { isOpen: true, classToEdit: cls };
                renderApp();
            } else {
                state.editingData = null;
                state.form = { className: cls, riskCount: '', leaderName: '', students: [] };
                navigateTo('form');
            }
        }

        function proceedToEdit() {
            const cls = state.confirmModal.classToEdit;
            const existingSubmission = state.submissions.find(s => s.className === cls);
            state.editingData = existingSubmission;
            state.form = {
                className: existingSubmission.className,
                riskCount: existingSubmission.riskCount,
                leaderName: existingSubmission.leaderName,
                students: existingSubmission.students.map(s => ({ ...s, substances: [...s.substances] }))
            };
            state.confirmModal = { isOpen: false, classToEdit: '' };
            navigateTo('form');
        }

        function cancelEdit() {
            state.confirmModal = { isOpen: false, classToEdit: '' };
            renderApp();
        }

        function adminLogin(e) {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;
            if (password === 'gongcodesmart') {
                state.isAdminLoggedIn = true;
                navigateTo('admin');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
                document.getElementById('admin-password').value = '';
            }
        }

        function adminLogout() {
            state.isAdminLoggedIn = false;
            navigateTo('home');
        }

        // --- Form Logic ---
        function handleRiskCountChange(val) {
            const count = Math.max(0, val === '' ? 0 : parseInt(val) || 0);
            state.form.riskCount = val;
            
            if (count > state.form.students.length) {
                for (let i = state.form.students.length; i < count; i++) {
                    state.form.students.push({ name: '', type: 'กลุ่มเสี่ยง', substances: [] });
                }
            } else if (count < state.form.students.length) {
                state.form.students = state.form.students.slice(0, count);
            }
            renderStudentsList();
        }

        function addStudentRow() {
            state.form.students.push({ name: '', type: 'กลุ่มเสี่ยง', substances: [] });
            state.form.riskCount = state.form.students.length;
            document.getElementById('form-riskcount').value = state.form.riskCount;
            renderStudentsList();
        }

        function removeStudent(index) {
            state.form.students.splice(index, 1);
            state.form.riskCount = state.form.students.length;
            document.getElementById('form-riskcount').value = state.form.riskCount;
            renderStudentsList();
        }

        function updateStudent(index, field, value) {
            state.form.students[index][field] = value;
        }

        function toggleSubstance(index, substance) {
            const subs = state.form.students[index].substances;
            if (subs.includes(substance)) {
                state.form.students[index].substances = subs.filter(s => s !== substance);
            } else {
                state.form.students[index].substances.push(substance);
            }
        }

        async function submitForm(e) {
            e.preventDefault();
            state.form.className = document.getElementById('form-class').value;
            state.form.leaderName = document.getElementById('form-leader').value;

            const submittedData = {
                className: state.form.className,
                riskCount: state.form.students.length,
                students: JSON.parse(JSON.stringify(state.form.students)),
                leaderName: state.form.leaderName
            };

            document.getElementById('main-content').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[60vh] zoom-in">
                    <i data-lucide="loader-2" class="text-indigo-500 w-16 h-16 mb-4 animate-spin"></i>
                    <h2 class="text-xl font-bold text-slate-800">กำลังส่งข้อมูลไปยังระบบ...</h2>
                    <p class="text-slate-500 text-sm mt-2">กรุณารอสักครู่</p>
                </div>
            `;
            lucide.createIcons();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(submittedData),
                    mode: 'no-cors'
                });

                // สั่งเล่นเสียงเมื่อบันทึกเสร็จ
                playThankYouSound();

                document.getElementById('main-content').innerHTML = `
                    <div class="flex
